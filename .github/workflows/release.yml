name: Release

# Triggered by keyword in commit message on push to main:
#   [release]    — publish current version unchanged
#   [bump patch] — 0.1.2 → 0.1.3
#   [bump minor] — 0.1.2 → 0.2.0
#   [bump major] — 0.1.2 → 1.0.0
#
# Requires repo secret: RELEASE_TOKEN
#   Fine-grained PAT — repository: this repo only
#   Permissions: Contents (read and write), Metadata (read, auto-granted)
#   Classic PAT alternative: repo scope
# GITHUB_TOKEN cannot be used — GitHub's anti-loop protection silently suppresses
# push/tag events originating from GITHUB_TOKEN, so release.yml would never re-trigger.

on:
  push:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: read version from .csproj, compute new version, commit + tag
  # ---------------------------------------------------------------------------
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute version, update .csproj, commit and tag
        id: bump
        shell: bash
        run: |
          MSG="${{ github.event.head_commit.message }}"

          if echo "$MSG" | grep -q "\[bump major\]"; then
            BUMP=major
          elif echo "$MSG" | grep -q "\[bump minor\]"; then
            BUMP=minor
          elif echo "$MSG" | grep -q "\[bump patch\]"; then
            BUMP=patch
          elif echo "$MSG" | grep -q "\[release\]"; then
            BUMP=none
          else
            echo "No release keyword found — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read current version from .csproj
          CURRENT=$(grep -oP '(?<=<Version>)[^<]+' MsgImageExtractor.csproj)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) NEW="$((MAJOR+1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            none)  NEW="${MAJOR}.${MINOR}.${PATCH}" ;;
          esac

          echo "Bumping $CURRENT → $NEW"

          # Write new version back to .csproj
          sed -i "s|<Version>${CURRENT}</Version>|<Version>${NEW}</Version>|" MsgImageExtractor.csproj

          # Commit and tag using RELEASE_TOKEN identity
          # Commit message intentionally omits bump keywords to prevent re-triggering
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}"

          if [ "$BUMP" != "none" ]; then
            git add MsgImageExtractor.csproj
            git commit -m "Bump version to ${NEW}"
          fi

          git tag "v${NEW}"
          git push origin main --follow-tags

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: build, test, publish, and create GitHub Release
  # ---------------------------------------------------------------------------
  build-and-release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Checkout the version-bump commit (HEAD of main after check-release pushed)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore MsgImageExtractor.sln /p:Platform=x64

      - name: Build
        run: dotnet build MsgImageExtractor.sln --configuration Release /p:Platform=x64

      - name: Test
        run: dotnet test tests/MsgImageExtractor.Tests.csproj --configuration Release /p:Platform=x64 --no-build --verbosity normal

      - name: Publish single-file executable
        run: >
          dotnet publish MsgImageExtractor.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      - name: Smoke test published executable
        shell: pwsh
        run: |
          $proc = Start-Process ./publish/MsgImageExtractor.exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            $events = Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-1)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'MsgImageExtractor' } |
              Select-Object -First 3 -ExpandProperty Message
            Write-Error "Published exe crashed on startup (exit code: $($proc.ExitCode))"
            if ($events) {
              Write-Error "Event Log entries:`n$($events -join "`n---`n")"
            }
            exit 1
          }
          Write-Host "Smoke test passed: exe stayed alive for 5 seconds"
          Stop-Process $proc -Force

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.zip

      - name: Stage standalone executable
        shell: pwsh
        run: Copy-Item publish\MsgImageExtractor.exe MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.exe

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          sha256sum MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.zip \
                    MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.exe \
                    > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: Release ${{ needs.check-release.outputs.new_version }}
          generate_release_notes: true
          files: |
            MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.exe
            MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
