name: Release

# Triggered by keyword in commit message on push to main:
#   [release]    — publish current version unchanged
#   [bump patch] — 0.1.2 → 0.1.3
#   [bump minor] — 0.1.2 → 0.2.0
#   [bump major] — 0.1.2 → 1.0.0
#
# Requires repo secret: RELEASE_TOKEN (PAT with repo scope)
# GITHUB_TOKEN cannot be used — GitHub's anti-loop protection silently swallows the release event.

on:
  push:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: detect bump keyword and compute next version
  # ---------------------------------------------------------------------------
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      new_version: ${{ steps.check.outputs.new_version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Detect bump keyword and compute version
        id: check
        shell: bash
        run: |
          MSG="${{ github.event.head_commit.message }}"
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"

          if echo "$MSG" | grep -q "\[bump major\]"; then
            NEW="$((MAJOR+1)).0.0"
          elif echo "$MSG" | grep -q "\[bump minor\]"; then
            NEW="${MAJOR}.$((MINOR+1)).0"
          elif echo "$MSG" | grep -q "\[bump patch\]"; then
            NEW="${MAJOR}.${MINOR}.$((PATCH+1))"
          elif echo "$MSG" | grep -q "\[release\]"; then
            NEW="${MAJOR}.${MINOR}.${PATCH}"
          else
            echo "No release keyword found — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "Computed release: v$NEW"

  # ---------------------------------------------------------------------------
  # Job 2: build, test, publish, and create GitHub Release
  # ---------------------------------------------------------------------------
  build-and-release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore MsgImageExtractor.sln

      - name: Build
        run: dotnet build MsgImageExtractor.sln --configuration Release

      - name: Test
        run: dotnet test tests/MsgImageExtractor.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish single-file executable
        run: >
          dotnet publish MsgImageExtractor.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.check-release.outputs.new_version }}
          --output ./publish

      - name: Smoke test published executable
        shell: pwsh
        run: |
          $proc = Start-Process ./publish/MsgImageExtractor.exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            $events = Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-1)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'MsgImageExtractor' } |
              Select-Object -First 3 -ExpandProperty Message
            Write-Error "Published exe crashed on startup (exit code: $($proc.ExitCode))"
            if ($events) {
              Write-Error "Event Log entries:`n$($events -join "`n---`n")"
            }
            exit 1
          }
          Write-Host "Smoke test passed: exe stayed alive for 5 seconds"
          Stop-Process $proc -Force

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.zip

      - name: Generate SHA256 checksum
        shell: bash
        run: sha256sum MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: Release ${{ needs.check-release.outputs.new_version }}
          generate_release_notes: true
          files: |
            MsgImageExtractor-${{ needs.check-release.outputs.new_version }}-win-x64.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
