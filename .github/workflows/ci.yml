name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for [canary] keyword
        id: check-canary
        shell: bash
        run: |
          MSG=$(git log -1 --format=%B)
          if echo "$MSG" | grep -q "\[canary\]"; then
            echo "run_canary=true" >> "$GITHUB_OUTPUT"
            echo "Canary keyword detected — canary steps will run."
          else
            echo "run_canary=false" >> "$GITHUB_OUTPUT"
            echo "No [canary] keyword — canary steps skipped."
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore MsgImageExtractor.sln /p:Platform=x64

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true

      - name: Build
        run: dotnet build MsgImageExtractor.sln --configuration Release /p:Platform=x64 /p:EnableNETAnalyzers=true /p:AnalysisLevel=latest

      - name: Test
        id: test
        run: dotnet test tests/MsgImageExtractor.Tests.csproj --configuration Release /p:Platform=x64 --no-build --filter "Category!=canary" --verbosity normal --results-directory ./TestResults --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      - name: Test with coverage
        run: dotnet test tests/MsgImageExtractor.Tests.csproj --configuration Release /p:Platform=x64 --no-build --filter "Category!=canary" --collect:"XPlat Code Coverage" --results-directory ./TestResults
        continue-on-error: true

      - name: Run canary (expected to fail — validates PR comment posting)
        id: canary
        if: github.event_name == 'pull_request' && steps.check-canary.outputs.run_canary == 'true'
        run: dotnet test tests/MsgImageExtractor.Tests.csproj --configuration Release /p:Platform=x64 --no-build --filter "Category=canary" --results-directory ./TestResults --logger "trx;LogFileName=canary-results.trx"
        continue-on-error: true

      - name: Post canary result to PR
        if: github.event_name == 'pull_request' && steps.check-canary.outputs.run_canary == 'true' && steps.canary.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("### Canary — CI comment posting validated :white_check_mark:")
          $lines.Add("")

          $trx = Get-ChildItem ./TestResults/canary-results.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            [xml]$xml = Get-Content $trx.FullName
            $failed = $xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }
            if ($failed) {
              $lines.Add("#### Failed canary tests (expected)")
              foreach ($t in $failed) {
                $lines.Add("**``$($t.testName)``**")
                $lines.Add('```')
                $lines.Add($t.Output.ErrorInfo.Message.Trim())
                $lines.Add('```')
                $lines.Add("")
              }
            }
          }

          $lines.Add("_Archive ``tests/CICommentCanaryTests.cs`` once this comment is confirmed._")
          $body = $lines -join "`n"
          gh pr comment ${{ github.event.pull_request.number }} --body $body

      - name: Publish single-file executable
        run: >
          dotnet publish MsgImageExtractor.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      - name: Smoke test published executable
        shell: pwsh
        run: |
          $proc = Start-Process ./publish/MsgImageExtractor.exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            $events = Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-1)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'MsgImageExtractor' } |
              Select-Object -First 3 -ExpandProperty Message
            Write-Error "Published exe crashed on startup (exit code: $($proc.ExitCode))"
            if ($events) {
              Write-Error "Event Log entries:`n$($events -join "`n---`n")"
            }
            exit 1
          }
          Write-Host "Smoke test passed: exe stayed alive for 5 seconds"
          Stop-Process $proc -Force

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/test-results.trx
          if-no-files-found: warn

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Post failure summary to PR
        if: (failure() || steps.test.outcome == 'failure') && github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("### CI Failure — run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})")
          $lines.Add("")

          # Parse TRX for individual test failures
          $trx = Get-ChildItem ./TestResults/*.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            [xml]$xml = Get-Content $trx.FullName
            $failed = $xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }
            if ($failed) {
              $lines.Add("#### Failed Tests")
              foreach ($t in $failed) {
                $lines.Add("**``$($t.testName)``**")
                $msg = $t.Output.ErrorInfo.Message -replace '\r\n','`n' -replace '\n','`n'
                $lines.Add('```')
                $lines.Add($t.Output.ErrorInfo.Message.Trim())
                $lines.Add('```')
                $lines.Add("")
              }
            } else {
              $lines.Add("Tests ran but no failures recorded in TRX — failure may be in build or publish step.")
            }
          } else {
            # No TRX means build or restore failed — grab last 40 lines of runner output via step summary
            $lines.Add("No test results found. The build likely failed before tests ran.")
            $lines.Add("")
            $lines.Add("Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for compiler errors.")
          }

          $body = $lines -join "`n"
          gh pr comment ${{ github.event.pull_request.number }} --body $body
