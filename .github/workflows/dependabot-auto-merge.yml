name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # patch / minor → auto-approve + squash merge with [bump patch]
      # The [bump patch] keyword feeds back into release.yml to auto-publish
      - name: Approve and merge patch/minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review "$PR_URL" --approve -b "Auto-approved: patch/minor dependency update"
          gh pr merge "$PR_URL" --squash --subject "chore: ${{ steps.metadata.outputs.dependency-names }} [bump patch]"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # major → approve but do NOT merge; leave comment for human review
      - name: Approve major updates (manual merge required)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr review "$PR_URL" --approve -b "Auto-approved: major dependency update — **manual merge required**. Review breaking changes before merging."
          gh pr comment "$PR_URL" --body "⚠️ **Major update detected.** This PR has been approved automatically but requires a human to review breaking changes and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
